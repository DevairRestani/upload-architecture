# Comments are provided throughout this file to help you get started.
# If you need more help, visit the Docker Compose reference guide at
# https://docs.docker.com/go/compose-spec-reference/

# Here the instructions define your application as a service called "server".
# This service is built from the Dockerfile in the current directory.
# You can add other services your application may depend on here, such as a
# database or a cache. For examples, see the Awesome Compose repository:
# https://github.com/docker/awesome-compose
services:
  server:
    build:
      context: .
      target: final
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=upload_architecture;Username=postgres;Password=postgres
      - ConnectionStrings__BlobStorage=DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;
      - BlobStorage__PublicEndpoint=http://localhost:10000
      - ClamAv__Host=clamav
      - ClamAv__Port=3310
      - ClamAv__StreamMaxLengthBytes=209715200
    depends_on:
      db:
        condition: service_healthy
      azurite:
        condition: service_started

  db:
    # Pin the major version instead of using `latest` to avoid unexpected
    # PostgreSQL data-directory changes between major releases.
    image: postgres:17-alpine
    restart: always
    user: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=upload_architecture
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d upload_architecture -h localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: upload_architecture_azurite
    command: "azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --skipApiVersionCheck"
    ports:
      - "10000:10000"
    volumes:
      - azurite_data:/data
  
  clamav:
    image: clamav/clamav:stable-debian
    container_name: upload_architecture_clamav
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sed -i 's/^#\?StreamMaxLength .*/StreamMaxLength 200M/' /etc/clamav/clamd.conf
        sed -i 's/^#\?MaxFileSize .*/MaxFileSize 200M/' /etc/clamav/clamd.conf
        sed -i 's/^#\?MaxScanSize .*/MaxScanSize 600M/' /etc/clamav/clamd.conf
        exec /init
    ports:
      - "3310:3310"
    volumes:
      - clamav_data:/var/lib/clamav
    restart: unless-stopped

volumes:
  db-data:
  azurite_data:
  clamav_data:
